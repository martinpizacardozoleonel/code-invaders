services:
  - type: web
    name: code-invaders
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/leaderboard
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      # Clave de los endpoints /api/admin/*. En el panel de Render hay que
      # ponerla a mano (no se sube desde acá). Sirve para exportar/importar
      # respaldos y para restaurar cuentas.
      - key: ADMIN_KEY
        sync: false